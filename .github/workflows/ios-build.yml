name: iOS Release Validation

on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/**", "icon-512.png", ".github/workflows/ios-build.yml"]
  push:
    branches: ["codex/**"]
    paths: ["mobile/**", "icon-512.png", ".github/workflows/ios-build.yml"]

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        env:
          LLCC_SERVER_URL: ${{ secrets.LLCC_SERVER_URL || 'https://lulu-line-control-center.streamlit.app' }}
        run: |
          npm run configure
          npx cap add ios
          npx cap sync ios
          python scripts/prepare_ios.py ../icon-512.png ios/App/App/Assets.xcassets/AppIcon.appiconset
          bash scripts/configure_ios.sh
      - name: Validate production settings
        working-directory: mobile
        run: |
          python - <<'PY'
          import json, plistlib
          from pathlib import Path
          icon_dir = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          icon_manifest = json.loads((icon_dir / "Contents.json").read_text())
          assert len(icon_manifest["images"]) == 18
          assert all((icon_dir / item["filename"]).is_file() for item in icon_manifest["images"])
          with open("ios/App/App/Info.plist", "rb") as handle:
              plist = plistlib.load(handle)
          assert plist["CFBundleDisplayName"] == "Lulu Line Control Center"
          assert plist["NSAppTransportSecurity"]["NSAllowsArbitraryLoads"] is False
          with open("capacitor.config.json", encoding="utf-8") as handle:
              config = json.load(handle)
          assert config["appId"] == "ae.lululine.controlcenter"
          assert config["server"]["url"].startswith("https://")
          print("Validated iOS identity, ATS and HTTPS endpoint")
          PY
      - name: Build release for iPhone simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator             PRODUCT_BUNDLE_IDENTIFIER=ae.lululine.controlcenter             MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }}             CODE_SIGNING_ALLOWED=NO build
      - name: Create unsigned App Store archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release             -destination "generic/platform=iOS"             -archivePath build/LuluLine.xcarchive             PRODUCT_BUNDLE_IDENTIFIER=ae.lululine.controlcenter             MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }}             CODE_SIGNING_ALLOWED=NO
          test -d build/LuluLine.xcarchive
          plutil -lint build/LuluLine.xcarchive/Info.plist
          ditto -c -k --sequesterRsrc --keepParent build/LuluLine.xcarchive build/LuluLine-unsigned-xcarchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lulu-line-ios-unsigned-archive
          path: mobile/ios/App/build/LuluLine-unsigned-xcarchive.zip
          if-no-files-found: error
