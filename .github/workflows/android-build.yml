name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: ["codex/**"]
    paths: ["mobile/**", ".github/workflows/android-build.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - working-directory: mobile
        run: npm install --no-audit --no-fund
      - working-directory: mobile
        env:
          LLCC_SERVER_URL: ${{ secrets.LLCC_SERVER_URL }}
        run: |
          npm run configure
          npx cap add android
          npx cap sync android
      - working-directory: mobile/android
        run: ./gradlew assembleDebug bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lulu-line-android-unsigned
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
